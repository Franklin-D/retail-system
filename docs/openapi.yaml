openapi: 3.1.2
info:
  title: Planet Color API
  description: >
    API REST del Sistema Web de Gestión "Planet Color".
    Autenticación por sesión PHP (cookie httpOnly PHPSESSID).
  version: 0.2.0
servers:
  - url: http://localhost/Ing-Soft/retail-system/backend/public/index.php/api
    description: Apache/XAMPP
  - url: http://localhost:8000/api
    description: Servidor de desarrollo local (php -S)

paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Sesión creada }
        '401': { description: Credenciales incorrectas }
  /auth/logout:
    post:
      summary: Cerrar sesión
      responses:
        '200': { description: Sesión cerrada }
  /auth/me:
    get:
      summary: Usuario de la sesión actual
      responses:
        '200': { description: Perfil }
        '401': { description: No autenticado }
  /products:
    get:
      summary: Listar productos
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200': { description: Listado }
    post:
      summary: Crear producto
      responses:
        '201': { description: Creado }
  /products/{id}:
    get:
      summary: Obtener producto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Producto }
    put:
      summary: Actualizar producto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Actualizado }
    delete:
      summary: Baja lógica de producto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Eliminado }
  /products/expiring:
    get:
      summary: Productos próximos a vencer con alertas y descuentos
      description: >
        Devuelve los productos publicados cuya fecha de vencimiento cae dentro
        de los próximos `dias` (por defecto 30), incluidos los ya vencidos.
        Cada producto incluye `dias_restantes`, `nivel_vencimiento`,
        `descuento_porcentaje`, `precio_con_descuento` y `ahorro`.
      parameters:
        - in: query
          name: dias
          schema: { type: integer, minimum: 1, default: 30 }
      responses:
        '200': { description: Resumen de alertas y listado de productos }
  /categories:
    get:
      summary: Listar categorías
      responses:
        '200': { description: Listado }
  /suppliers:
    get:
      summary: Listar proveedores
      responses:
        '200': { description: Listado }
  /customers:
    get:
      summary: Listar clientes
      responses:
        '200': { description: Listado }
  /sales:
    get:
      summary: Listar ventas
      responses:
        '200': { description: Listado }
    post:
      summary: Registrar venta (alias de checkout)
      responses:
        '201': { description: Creada }
  /sales/checkout:
    post:
      summary: Registrar venta, descontar stock, ingreso y boleta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, metodo_pago]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      producto_id: { type: integer }
                      cantidad: { type: integer }
                metodo_pago:
                  type: string
                  enum: [Efectivo, Tarjeta, Yape, Plin]
                cliente_id: { type: integer }
      responses:
        '201': { description: Venta y factura }
  /purchases:
    get:
      summary: Listar compras
      responses:
        '200': { description: Listado }
  /invoices:
    get:
      summary: Listar facturas
      responses:
        '200': { description: Listado }
  /income:
    get:
      summary: Listar ingresos
      responses:
        '200': { description: Listado }
  /expenses:
    get:
      summary: Listar egresos
      responses:
        '200': { description: Listado }
    post:
      summary: Registrar un egreso de caja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descripcion, monto]
              properties:
                descripcion: { type: string }
                monto: { type: number, minimum: 0.01 }
                motivo:
                  type: string
                  enum: [Compra, Devolucion, 'Producto danado', 'Producto vencido', Otro]
                  default: Otro
                fecha:
                  type: string
                  format: date
                  description: Fecha del egreso (YYYY-MM-DD). Si se omite, se usa la fecha actual.
                compra_id:
                  type: [integer, 'null']
                  description: Compra asociada, si aplica.
      responses:
        '201': { description: Egreso registrado }
        '400': { description: Datos inválidos }
        '422': { description: Errores de validación }
  /finance/dashboard:
    get:
      summary: Dashboard financiero agregado
      description: >
        KPIs, serie diaria de ingresos/egresos, top 5 de productos vendidos,
        alertas de stock y movimientos del período. Las ventas se filtran por
        fecha y categoría; ingresos y egresos de caja se filtran por fecha.
      parameters:
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicial inclusive (YYYY-MM-DD).
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha final inclusive (YYYY-MM-DD).
        - in: query
          name: categoria_id
          schema: { type: integer, minimum: 1 }
          description: Filtra ventas, top de productos y alertas de stock por categoría.
      responses:
        '200':
          description: >
            Objeto con filtros, resumen (ventas_hoy, ventas_periodo,
            ingresos_periodo, egresos_periodo, balance_periodo), serie,
            top_productos, alertas_stock y movimientos.
        '400': { description: Fechas o categoría inválidas }
  /finance/movimientos:
    get:
      summary: Movimientos financieros combinados
      description: >
        Ventas, ingresos manuales y egresos ordenados por fecha descendente.
        Cada venta reemplaza a su ingreso automático para evitar duplicados.
      responses:
        '200': { description: Listado combinado de movimientos }
  /reports:
    get:
      summary: Catálogo de reportes
      responses:
        '200': { description: Listado }
  /reports/summary:
    get:
      summary: Resumen de inventario y ganancia
      responses:
        '200': { description: Totales }
  /reports/inventory:
    get:
      summary: Reporte de inventario
      responses:
        '200': { description: Productos con alertas }
  /reports/profits:
    get:
      summary: Reporte de ganancias
      responses:
        '200': { description: Totales y ventas }

components:
  schemas: {}
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: Autenticación basada en sesión de PHP (cookie httpOnly).

security:
  - sessionAuth: []
