<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail System - Productos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Productos Retail</h1>
        
        <div class="cards">
            <div class="card">Productos: <span id="total-prod">0</span></div>
            <div class="card">Stock Total: <span id="total-stock">0</span></div>
            <div class="card ganancia">Ganancia Potencial: S/ <span id="total-ganancia">0.00</span></div>
        </div>

        <form id="form-producto">
            <h3>Agregar Producto</h3>
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="text" name="codigo" placeholder="Código" required>
            <input type="number" step="0.01" name="costo" placeholder="Costo" required>
            <input type="number" step="0.01" name="precio_venta" placeholder="Precio Venta" required>
            <input type="number" name="stock" placeholder="Stock" required>
            <button type="submit">Guardar</button>
        </form>

        <table>
            <thead>
                <tr><th>ID</th><th>Nombre</th><th>Código</th><th>Costo</th><th>Venta</th><th>Stock</th><th>Ganancia x Und</th><th>Acción</th></tr>
            </thead>
            <tbody id="tabla-productos"></tbody>
        </table>
    </div>
<script src="js/app.js"></script>
</body>
</html>
