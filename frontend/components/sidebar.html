<!--
  components/sidebar.html
  -----------------------------------------------------------------------
  Fragmento HTML reutilizable en todas las páginas del dashboard.
  Se inyecta en tiempo de carga mediante components/load-component.js,
  que es el "patrón de componentes" elegido para JS vanilla (sin
  frameworks): cada fragmento vive en su propio archivo y se carga por
  fetch() + injection en un contenedor <div data-component="sidebar">.

  El atributo data-page en cada <body> de las páginas se usa para marcar
  como "activo" el ítem correspondiente (ver load-component.js).
  -----------------------------------------------------------------------
-->
