<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Color · Panel Principal</title>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="dashboard">
  <div style="display:flex; height:100%; width:100%;">
    <div data-component="sidebar"></div>

    <div class="main-content">
      <button class="hamburger-btn" id="hamburgerBtn"><i data-lucide="menu"></i></button>

      <h1 style="font-size: 32px; margin-bottom: 20px;">Bienvenido a Planet Color</h1>

      <div class="grid-3" id="statsCards">
        <div class="card">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Total de Productos</div>
              <div id="totalProducts" style="font-size: 28px; font-weight: bold; color: #6366f1;">—</div>
            </div>
            <i data-lucide="box" style="width: 40px; height: 40px; color: #6366f1; opacity: 0.5;"></i>
          </div>
        </div>
        <div class="card">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Stock Total</div>
              <div id="totalStock" style="font-size: 28px; font-weight: bold; color: #8b5cf6;">—</div>
            </div>
            <i data-lucide="layers" style="width: 40px; height: 40px; color: #8b5cf6; opacity: 0.5;"></i>
          </div>
        </div>
        <div class="card">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Valor Inventario</div>
              <div id="inventoryValue" style="font-size: 28px; font-weight: bold; color: #ec4899;">—</div>
            </div>
            <i data-lucide="trending-up" style="width: 40px; height: 40px; color: #ec4899; opacity: 0.5;"></i>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:20px;">
        <p style="color:#94a3b8; font-size:13px;">
          Estas tarjetas se llenan con datos reales del backend en la
          <strong>Etapa 10</strong> (reportes), consumiendo
          <code>/api/reports/summary</code> desde <code>js/modules/dashboard.js</code>.
        </p>
      </div>
    </div>
  </div>

  <script src="../components/load-component.js" type="module"></script>
  <script type="module" src="../js/modules/dashboard.js"></script>
</body>
</html>
